<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>Notely — school notes</title>
<style>
:root{
  --bg:#14161c; --panel:#1c1f27; --panel2:#22262f; --border:#30353f;
  --text:#e8eaf0; --muted:#9aa1ad; --accent:#5b8cff; --ok:#3fb950; --bad:#f0553f;
  --warn:#e3b341;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;
  background:var(--panel);border-bottom:1px solid var(--border);flex:0 0 auto}
.brand{font-size:18px;font-weight:700}
.tab{background:none;border:1px solid transparent;color:var(--muted);padding:7px 14px;
  border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
.tab.active{background:var(--panel2);border-color:var(--border);color:var(--text)}
.spacer{flex:1}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--border);
  background:var(--panel2);color:var(--muted)}
.chip.ok{color:#b9f6ca;border-color:#2ea04355;background:#2ea04322}
.chip.bad{color:#ffc9c0;border-color:#f0553f55;background:#f0553f22}
kbd{background:var(--panel2);border:1px solid var(--border);border-bottom-width:2px;
  border-radius:5px;padding:0 5px;font-size:11.5px}
main{flex:1 1 auto;display:flex;min-height:0}
.hidden{display:none!important}

/* ------------------------------------------------------------- sidebar */
#sidebar{width:250px;flex:0 0 auto;background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0}
.side-top{padding:10px;display:flex;gap:8px;flex-direction:column}
input[type=text],textarea{background:var(--panel2);border:1px solid var(--border);color:var(--text);
  border-radius:8px;padding:8px 10px;font:inherit;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
.btn{background:var(--panel2);color:var(--text);border:1px solid var(--border);
  border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.danger{color:#ffb4a8}
.btn.small{padding:4px 9px;font-size:12.5px}
#note-list{overflow-y:auto;flex:1 1 auto;padding:4px 6px 12px}
.note-item{padding:8px 10px;border-radius:8px;cursor:pointer;margin:2px 0;
  border:1px solid transparent;display:flex;flex-direction:column;gap:2px}
.note-item:hover{background:var(--panel2)}
.note-item.active{background:#2a3142;border-color:#43507a}
.note-item .nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-item .meta{font-size:11.5px;color:var(--muted)}
.side-bottom{padding:8px 10px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted)}

/* -------------------------------------------------------------- editor */
#editor-pane{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0}
.ed-top{display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
#title{font-size:17px;font-weight:600;background:none;border:1px solid transparent;padding:6px 8px;border-radius:8px;width:36ch;max-width:40vw;color:var(--text)}
#title:hover{border-color:var(--border)}
.seg{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{background:var(--panel2);color:var(--muted);border:none;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.toolbar{display:flex;gap:4px;padding:6px 12px;flex-wrap:wrap;border-bottom:1px solid var(--border);background:#181b22}
.toolbar button{background:var(--panel2);border:1px solid var(--border);color:var(--text);
  border-radius:6px;min-width:30px;padding:4px 8px;cursor:pointer;font-size:13px}
.toolbar button:hover{border-color:var(--accent)}
#edit-area{flex:1 1 auto;display:flex;min-height:0}
#src{flex:1 1 50%;resize:none;border:none;border-radius:0;background:#15171d;padding:16px 18px;
  font:14.5px/1.6 Consolas,"Cascadia Mono",monospace;min-width:0}
#src:focus{outline:none}
#preview{flex:1 1 50%;overflow-y:auto;padding:16px 22px 60px;min-width:0;border-left:1px solid var(--border)}
body.mode-write #preview{display:none}
body.mode-write #src{flex:1 1 100%;border-left:none}
body.mode-read #src{display:none}
body.mode-read #preview{border-left:none;flex:1 1 100%}
.status{font-size:12px;color:var(--muted);padding:0 12px 8px}

/* --------------------------------------------------------------- guide */
#guide-pane{flex:1 1 auto;overflow-y:auto;padding:20px 26px 80px}
#guide-pane .wrap{max-width:880px;margin:0 auto}
.g-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;
  padding:16px 18px;margin-bottom:16px}
.g-card h3{margin:0 0 6px;font-size:16.5px}
.g-card .blurb{color:var(--muted);font-size:14px;margin:0 0 10px}
.g-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:820px){.g-grid{grid-template-columns:1fr}}
.g-code{position:relative;background:#0f1115;border:1px solid var(--border);border-radius:9px;
  padding:12px 12px 12px;overflow-x:auto}
.g-code pre{margin:0;font:13px/1.55 Consolas,"Cascadia Mono",monospace;white-space:pre-wrap;color:#cfe3ff}
.g-copy{position:absolute;top:7px;right:7px;font-size:11.5px;padding:3px 9px;border-radius:6px;
  background:var(--panel2);border:1px solid var(--border);color:var(--muted);cursor:pointer}
.g-copy:hover{color:var(--text);border-color:var(--accent)}
.g-preview{background:#fff;color:#1a1a1a;border-radius:9px;padding:14px 16px;overflow-x:auto;
  font-size:14.5px;border:1px solid var(--border)}
.g-preview table{border-collapse:collapse}
.g-head{margin:6px 0 14px}
.g-head h2{margin:0 0 4px}
.g-head p{color:var(--muted);margin:0}
.tmpl{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* -------------------------------------------------- markdown rendering */
#preview h1{font-size:26px;border-bottom:1px solid var(--border);padding-bottom:6px;margin:6px 0 14px}
#preview h2{font-size:21px;margin:22px 0 8px;color:#cdd6ff}
#preview h3{font-size:17.5px;margin:18px 0 6px}
#preview p{margin:8px 0}
#preview ul,#preview ol{margin:8px 0;padding-left:26px}
#preview li{margin:3px 0}
#preview blockquote{margin:10px 0;padding:8px 14px;border-left:3px solid var(--accent);
  background:#5b8cff14;border-radius:0 8px 8px 0;color:#d5dbe8}
#preview code{background:#2a2f3a;border-radius:5px;padding:1.5px 6px;font:13.5px Consolas,monospace;color:#ffd9a0}
#preview pre{background:#0f1115;border:1px solid var(--border);border-radius:9px;padding:12px 14px;overflow-x:auto}
#preview pre code{background:none;color:#cfe3ff;padding:0;font-size:13.5px}
#preview a{color:var(--accent)}
#preview mark{background:#e3b34155;color:#ffe8a3;border-radius:3px;padding:0 3px}
#preview del{color:var(--muted)}
#preview hr{border:none;border-top:1px solid var(--border);margin:18px 0}
#preview table{border-collapse:collapse;margin:12px 0;font-size:14px}
#preview th,#preview td{border:1px solid var(--border);padding:6px 11px;text-align:left}
#preview th{background:var(--panel2)}
#preview img{max-width:100%;border-radius:8px;background:#fff}
#preview .task{list-style:none;margin-left:-20px}
#preview .task input{margin-right:8px;accent-color:var(--accent)}
#preview .qcard{border:1px solid var(--border);border-left:3px solid var(--warn);
  background:#e3b34110;border-radius:8px;padding:9px 13px;margin:9px 0}
.imgph{display:inline-block;border:1px dashed var(--border);border-radius:6px;
  padding:3px 9px;font-size:12.5px;color:var(--muted);background:var(--panel2)}
.empty{color:var(--muted);text-align:center;margin-top:70px;font-size:15px}
</style>
</head>
<body class="mode-split">
<header>
  <div class="brand">📝 Notely</div>
  <button id="tab-notes" class="tab active">Notes</button>
  <button id="tab-guide" class="tab">Guide &amp; explain</button>
  <span class="spacer"></span>
  <span id="chip" class="chip">connecting…</span>
</header>

<main>
  <!-- ================================================== NOTES VIEW -->
  <div id="notes-view" style="display:flex;flex:1;min-height:0">
    <aside id="sidebar">
      <div class="side-top">
        <button class="btn primary" id="btn-new">＋ New note</button>
        <input type="text" id="search" placeholder="Search notes…">
      </div>
      <div id="note-list"></div>
      <div class="side-bottom" id="side-count">—</div>
    </aside>

    <section id="editor-pane">
      <div class="ed-top">
        <input id="title" type="text" placeholder="Untitled note">
        <span class="spacer"></span>
        <div class="seg">
          <button data-mode="write">Write</button>
          <button data-mode="split" class="on">Split</button>
          <button data-mode="read">Read</button>
        </div>
        <button class="btn small" id="btn-dl">Download .md</button>
        <button class="btn small danger" id="btn-del">Delete</button>
      </div>
      <div class="toolbar">
        <button data-ins="h1" title="Heading 1">H1</button>
        <button data-ins="h2" title="Heading 2">H2</button>
        <button data-ins="h3" title="Heading 3">H3</button>
        <button data-ins="bold" title="Bold (Ctrl+B)"><b>B</b></button>
        <button data-ins="italic" title="Italic (Ctrl+I)"><i>I</i></button>
        <button data-ins="mark" title="Highlight">HL</button>
        <button data-ins="strike" title="Strikethrough">S</button>
        <button data-ins="code" title="Inline code">&lt;/&gt;</button>
        <button data-ins="ul" title="Bullet list">• list</button>
        <button data-ins="ol" title="Numbered list">1. list</button>
        <button data-ins="task" title="Checkbox">☐ task</button>
        <button data-ins="quote" title="Callout box">❝ box</button>
        <button data-ins="table" title="Table">⊞ table</button>
        <button data-ins="codeblock" title="Code block">{ } code</button>
        <button data-ins="divider" title="Divider">—</button>
        <button data-ins="link" title="Link">🔗</button>
      </div>
      <div id="edit-area">
        <textarea id="src" spellcheck="true" placeholder="Start typing… markdown cheatsheet is in the Guide tab"></textarea>
        <div id="preview"></div>
      </div>
      <div class="status" id="status">—</div>
    </section>
  </div>

  <!-- ================================================== GUIDE VIEW -->
  <div id="guide-pane" class="hidden">
    <div class="wrap">
      <div class="g-head">
        <h2>Guide — how to write notes here</h2>
        <p>Plain-text markdown. Every example shows the exact text on the left and how
           it renders on the right. Press <b>Copy</b>, paste into your note, edit it.</p>
        <div class="tmpl">
          <button class="btn" data-tmpl="cornell">＋ Cornell notes template</button>
          <button class="btn" data-tmpl="flash">＋ Flashcards template</button>
          <button class="btn" data-tmpl="exam">＋ Exam prep template</button>
        </div>
      </div>
      <div id="guide-list"></div>
    </div>
  </div>
</main>

<script>
'use strict';
/* =================================================================== state */
const $ = s => document.querySelector(s);
const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const MIRROR = 'notely.mirror';

const st = {
  notes: [],        // [{name, mtime, words, size}]
  current: null,    // file name
  mode: 'split',
  saveTimer: null,
  dirty: false,
  serverOk: false,
};

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function baseName(file){ return file.replace(/\.md$/i, ''); }
function fmtDate(t){
  const d = new Date(t * 1000);
  const today = new Date();
  const same = d.toDateString() === today.toDateString();
  return same ? d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
              : d.toLocaleDateString([], {month:'short', day:'numeric'});
}

/* ============================================================ markdown md */
let NOIMG = false;   // guide previews render image placeholders instead of fetching
function inline(s){
  // code spans first so their contents aren't touched
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0000C' + (codes.length-1) + '\u0000'; });
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, alt, src2) => {
    if (NOIMG) return '<span class="imgph">🖼 ' + esc(alt || src2) + '</span>';
    let u = src2;
    if (!/^(https?:|data:|\/)/i.test(u)) u = '/file?name=' + encodeURIComponent(u);
    return '<img src="' + esc(u) + '" alt="' + esc(alt) + '">';
  });
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,
    (m, t, href) => '<a href="' + esc(href) + '" target="_blank" rel="noopener">' + t + '</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>');
  s = s.replace(/==([^=]+)==/g, '<mark>$1</mark>');
  s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  s = s.replace(/\u0000C(\d+)\u0000/g, (m, i) => '<code>' + esc(codes[+i]) + '</code>');
  return s;
}

function renderMarkdown(src, opts){
  NOIMG = !!(opts && opts.noImages);
  const fences = [];
  src = String(src || '').replace(/\r\n/g, '\n')
    .replace(/```(\w*)\n([\s\S]*?)```/g, (m, lang, code) => {
      fences.push({lang, code});
      return '\u0001F' + (fences.length - 1) + '\u0001';
    });

  const lines = src.split('\n');
  const out = [];
  let i = 0;
  const isTableSep = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l) && l.includes('-');
  const cells = l => l.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(c => c.trim());

  while (i < lines.length){
    let line = lines[i];

    if (/^\u0001F\d+\u0001$/.test(line.trim())){
      const f = fences[+line.trim().replace(/\D/g, '')];
      out.push('<pre><code>' + esc(f.code.replace(/\n$/, '')) + '</code></pre>');
      i++; continue;
    }
    if (!line.trim()){ i++; continue; }

    let m;
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))){
      const lv = Math.min(6, m[1].length);
      out.push('<h' + lv + '>' + inline(esc(m[2])) + '</h' + lv + '>');
      i++; continue;
    }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(line)){ out.push('<hr>'); i++; continue; }

    if (line.trim().startsWith('>')){
      const buf = [];
      while (i < lines.length && lines[i].trim().startsWith('>')){
        buf.push(lines[i].replace(/^\s*>\s?/, ''));
        i++;
      }
      out.push('<blockquote>' + renderMarkdown(buf.join('\n'), opts) + '</blockquote>');
      continue;
    }

    // table: header row + separator row
    if (line.includes('|') && i + 1 < lines.length && isTableSep(lines[i+1]) && lines[i+1].includes('|')){
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes('|') && lines[i].trim()){
        rows.push(cells(lines[i])); i++;
      }
      let t = '<table><thead><tr>' + head.map(h => '<th>' + inline(esc(h)) + '</th>').join('') + '</tr></thead><tbody>';
      rows.forEach(r => { t += '<tr>' + r.map(c => '<td>' + inline(esc(c)) + '</td>').join('') + '</tr>'; });
      out.push(t + '</tbody></table>');
      continue;
    }

    // lists (bullets / numbered / tasks)
    if (/^\s*([-*+]|\d+[.)])\s+/.test(line)){
      const ordered = /^\s*\d+[.)]\s+/.test(line);
      const items = [];
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])){
        let it = lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/, '');
        let task = null;
        const tm = it.match(/^\[([ xX])\]\s+(.*)$/);
        if (tm){ task = tm[1].toLowerCase() === 'x'; it = tm[2]; }
        items.push({task, text: it});
        i++;
      }
      const tag = ordered ? 'ol' : 'ul';
      let html = '<' + tag + '>';
      items.forEach(it => {
        if (it.task === null) html += '<li>' + inline(esc(it.text)) + '</li>';
        else html += '<li class="task"><input type="checkbox" disabled' + (it.task ? ' checked' : '') + '>' + inline(esc(it.text)) + '</li>';
      });
      out.push(html + '</' + tag + '>');
      continue;
    }

    // paragraph
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|\s*([-*+]|\d+[.)])\s|\s*>|.*\u0001F)/.test(lines[i])
           && !(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(lines[i]))
           && !(lines[i].includes('|') && i + 1 < lines.length && isTableSep(lines[i+1]))){
      buf.push(lines[i]); i++;
    }
    if (buf.length) out.push('<p>' + inline(esc(buf.join(' '))) + '</p>');
    else { i++; }   // safety: never loop forever
  }
  return out.join('\n');
}

/* ================================================================ server */
async function api(path, body, tries){
  tries = tries || 3;
  let lastErr;
  for (let i = 0; i < tries; i++){
    try {
      const r = await fetch(path, body === undefined ? {} : {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify(body)
      });
      const j = await r.json();
      if (j.error) { const e = new Error(j.error); e.real = true; throw e; }
      return j;
    } catch(e){
      lastErr = e;
      if (e.real) throw e;
      await sleep(400 + i * 500);
    }
  }
  throw lastErr;
}
function setChip(ok, txt){
  st.serverOk = ok;
  const c = $('#chip');
  c.className = 'chip ' + (ok ? 'ok' : 'bad');
  c.textContent = txt;
}
async function ping(){
  try {
    const j = await api('/api/ping');
    setChip(true, '● vault: ' + j.notes + ' note' + (j.notes === 1 ? '' : 's'));
    return true;
  } catch(e){
    setChip(false, '● server down — edits kept in browser only');
    return false;
  }
}

/* ============================================================== sidebar */
const searchCache = {};          // name -> lowercased content (for inside-search)
async function ensureContents(names){
  const missing = names.filter(n => !(n in searchCache)).slice(0, 300);
  await Promise.all(missing.map(async n => {
    try {
      const j = await api('/api/note?name=' + encodeURIComponent(n));
      searchCache[n] = j.content.toLowerCase();
    } catch(e){ searchCache[n] = ''; }
  }));
}
function renderList(){
  const q = $('#search').value.trim().toLowerCase();
  const items = st.notes.filter(n =>
    !q || n.name.toLowerCase().includes(q) ||
    (searchCache[n.name] || '').includes(q));
  $('#note-list').innerHTML = items.map(n =>
    '<div class="note-item' + (n.name === st.current ? ' active' : '') + '" data-name="' + esc(n.name) + '">' +
      '<span class="nm">' + esc(baseName(n.name)) + '</span>' +
      '<span class="meta">' + fmtDate(n.mtime) + ' · ' + n.words + ' words</span>' +
    '</div>').join('') ||
    '<div class="empty" style="margin-top:24px;font-size:13.5px">No notes match.</div>';
  $('#side-count').textContent = st.notes.length + ' note' + (st.notes.length === 1 ? '' : 's') +
    ' · stored as .md files';
  $$('#note-list .note-item').forEach(el => el.onclick = () => openNote(el.dataset.name));
}
async function refreshNotes(){
  try {
    const j = await api('/api/notes');
    st.notes = j.notes;
    renderList();
  } catch(e){ /* keep last list */ }
}

/* =============================================================== editor */
function statusSave(txt, kind){
  const el = $('#status');
  el.textContent = txt;
  el.style.color = kind === 'err' ? '#ffb4a8' : '';
}
function currentContent(){ return $('#src').value; }

function renderPreview(){
  $('#preview').innerHTML = renderMarkdown($('#src').value) ||
    '<div class="empty">Nothing yet — start typing, or open the <b>Guide &amp; explain</b> tab.</div>';
}
function markDirty(){
  st.dirty = true;
  statusSave('typing…');
  clearTimeout(st.saveTimer);
  st.saveTimer = setTimeout(saveCurrent, 800);
}
async function saveCurrent(silent){
  if (!st.current) return false;
  st.dirty = false;
  const title = $('#title').value.trim();
  // title line is the first "# heading" or the file name — we keep them in sync
  const wanted = safeFile(title || baseName(st.current));
  const content = currentContent();
  try {
    const j = await api('/api/note', {name: wanted, content});
    if (wanted !== st.current){
      // renamed (title changed) — drop the old file
      if (st.notes.some(n => n.name === st.current)){
        try { await api('/api/delete', {name: st.current}); } catch(e){}
      }
      st.current = j.name;
    }
    const rec = st.notes.find(n => n.name === st.current);
    const words = (content.match(/\S+/g) || []).length;
    delete searchCache[st.current];   // content changed — drop stale search copy
    if (rec){ rec.name = st.current; rec.words = words; rec.mtime = Math.floor(Date.now()/1000); }
    else st.notes.unshift({name: st.current, words, mtime: Math.floor(Date.now()/1000)});
    mirrorSave();
    statusSave('saved ✓ ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'}));
    renderList();
    if (!silent) pingLight();
    return true;
  } catch(e){
    mirrorSave();   // server failed — still keep a browser copy
    statusSave('server save failed (' + e.message + ') — kept in browser mirror', 'err');
    return false;
  }
}
let pingBusy = false;
async function pingLight(){
  if (pingBusy) return; pingBusy = true;
  try { await ping(); } finally { pingBusy = false; }
}
function safeFile(t){
  let s = String(t || '').replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim();
  if (!s) s = 'untitled';
  return s.slice(0, 80).toLowerCase().replace(/[ .]+$/,'') + '.md';
}
function mirrorSave(){
  try {
    localStorage.setItem(MIRROR, JSON.stringify({name: st.current, content: currentContent(),
      at: Date.now()}));
  } catch(e){}
}

async function openNote(name){
  if (st.dirty) await saveCurrent(true);
  try {
    const j = await api('/api/note?name=' + encodeURIComponent(name));
    st.current = j.name;
    $('#title').value = baseName(j.name);
    $('#src').value = j.content;
    renderPreview();
    renderList();
    statusSave('loaded ' + j.name);
  } catch(e){
    statusSave('could not open: ' + e.message, 'err');
  }
}
async function newNote(){
  if (st.dirty) await saveCurrent(true);
  let n = 'untitled', k = 2;
  while (st.notes.some(x => x.name === n + '.md')) n = 'untitled ' + (k++);
  const content = '# ' + n + '\n\n';
  try {
    const j = await api('/api/note', {name: n + '.md', content});
    st.current = j.name;
    $('#title').value = baseName(j.name);
    $('#src').value = content;
    renderPreview();
    await refreshNotes();
    renderList();
    $('#title').focus(); $('#title').select();
    statusSave('created ' + j.name);
  } catch(e){
    // offline: still allow a local draft
    st.current = n + '.md';
    $('#title').value = n;
    $('#src').value = content;
    renderPreview();
    statusSave('offline — draft only (' + e.message + ')', 'err');
  }
}
async function deleteNote(){
  if (!st.current) return;
  if (!confirm('Delete "' + baseName(st.current) + '"? It moves to trash/ (recoverable file).')) return;
  try {
    await api('/api/delete', {name: st.current});
    st.notes = st.notes.filter(n => n.name !== st.current);
    delete searchCache[st.current];
    st.current = null;
    $('#title').value = '';
    $('#src').value = '';
    renderPreview();
    if (st.notes.length) await openNote(st.notes[0].name); else renderList();
    statusSave('deleted (file moved to trash/)');
    pingLight();
  } catch(e){ statusSave('delete failed: ' + e.message, 'err'); }
}
function downloadMd(){
  if (!st.current) return;
  const blob = new Blob([currentContent()], {type:'text/markdown'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = st.current;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ============================================================= toolbar */
const INSERTS = {
  h1:      {block:true,  make:() => '# '},
  h2:      {block:true,  make:() => '## '},
  h3:      {block:true,  make:() => '### '},
  bold:    {wrap:['**','**'], key:'b'},
  italic:  {wrap:['*','*'],   key:'i'},
  mark:    {wrap:['==','==']},
  strike:  {wrap:['~~','~~']},
  code:    {wrap:['`','`']},
  link:    {wrap:['[','](https://)']},
  ul:      {block:true, make:() => '- '},
  ol:      {block:true, make:() => '1. '},
  task:    {block:true, make:() => '- [ ] '},
  quote:   {block:true, make:() => '> '},
  divider: {block:true, make:() => '---'},
  table:   {block:true, make:() =>
    '| Column 1 | Column 2 |\n|---|---|\n| value | value |'},
  codeblock:{block:true, make:() => '```\ncode here\n```'},
};
function insert(kind){
  const ta = $('#src');
  const spec = INSERTS[kind];
  if (!spec) return;
  const s = ta.selectionStart, e = ta.selectionEnd;
  const v = ta.value;
  const sel = v.slice(s, e);
  if (spec.wrap){
    ta.value = v.slice(0, s) + spec.wrap[0] + (sel || 'text') + spec.wrap[1] + v.slice(e);
    const inner = s + spec.wrap[0].length;
    ta.setSelectionRange(inner, inner + (sel || 'text').length);
  } else if (spec.block){
    const lineStart = v.lastIndexOf('\n', s - 1) + 1;
    const prefix = spec.make();
    // multi-line table/code get prefixed per line only when nothing selected
    const chunk = sel || '';
    let text;
    if (chunk && chunk.includes('\n')){
      text = chunk.split('\n').map(l => (kind === 'table' || kind === 'codeblock' ? l : prefix + l)).join('\n');
      if (kind === 'codeblock') text = '```\n' + chunk + '\n```';
      if (kind === 'table') text = chunk;
    } else {
      text = prefix + (chunk || (kind === 'table' || kind === 'codeblock' ? '' : 'text'));
      if (kind === 'table' && !chunk) text = INSERTS.table.make();
      if (kind === 'codeblock' && !chunk) text = '```\n\n```';
    }
    ta.value = v.slice(0, lineStart) + text + v.slice(e);
    ta.setSelectionRange(lineStart, lineStart + text.length);
  }
  ta.focus();
  markDirty();
  renderPreview();
}

/* ================================================================ modes */
function setMode(mode){
  st.mode = mode;
  document.body.className = 'mode-' + mode;
  $$('.seg button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
  if (mode !== 'write') renderPreview();
}

/* ================================================================ guide */
const GUIDE = [
  {t:'Headings — structure a note',
   b:'Start a line with # marks. One # is the big title, ## section, ### subsection. This is how you give a note a shape you can scan in 3 seconds.',
   c:'# Photosynthesis\n## Definitions\n### Key equation\n#### Small detail'},
  {t:'Bold, italic, highlight, strike',

   c:'**Oxygen** is **produced** in the *light reactions*.\n==Chlorophyll absorbs red and blue light==.\n~~Mitochondria do photosynthesis~~'},
  {t:'Lists and checkboxes',
   b:'- for bullets, 1. 2. 3. for numbers, and - [ ] for a tick-box. Tasks are perfect for homework and revision plans.',
   c:'- [ ] Read chapter 4\n- [ ] Do past paper Q1–Q3\n- [x] Summarise notes\n\n1. Write the definition\n2. Give one example\n3. State the significance'},
  {t:'Callout box (blockquote)',

  {t:'Tables — comparison and data',

   c:'| Structure | Function |\n|---|---|\n| Leaf | absorbs light |\n| Stoma | gas exchange |\n| Xylem | carries water up |'},
  {t:'Code blocks (IT/CS work)',
   b:'Three backticks around code. It keeps indentation and colour-free monospace so nothing reflows. For inline code inside a sentence, use single backticks like `variable`.',

  {t:'Links and images',
   b:'[text](url) makes a link. For images, drop the file into the notes/ folder next to your notes and reference it by name: ![what it is](picture.png).',
   c:'[Past papers](https://www.education.gov.za)\n\n![heart diagram](heart.png)'},
  {t:'Flashcard style (Q/A)',
   b:'A pattern you can reuse anywhere: question line, blank line, answer line. Read top-down, cover the answer with your hand — instant testing.',
   c:'**Q:** What is the function of the septum?\n\n**A:** Separates the left and right sides of the heart, stopping oxygenated and deoxygenated blood mixing.'},
  {t:'Horizontal rules and dividers',
   b:'Three dashes on their own line — splits a long note into clear sections without needing a heading.',
   c:'---\n## Week 2\n---'},
];
function renderGuide(){
  $('#guide-list').innerHTML = GUIDE.map((g, i) =>
    '<div class="g-card">' +
      '<h3>' + esc(g.t) + '</h3>' +
      '<p class="blurb">' + esc(g.b) + '</p>' +
      '<div class="g-grid">' +
        '<div class="g-code"><button class="g-copy" data-copy="' + i + '">Copy</button>' +
          '<pre>' + esc(g.c) + '</pre></div>' +
        '<div class="g-preview">' + renderMarkdown(g.c, {noImages:true}) + '</div>' +
      '</div>' +
    '</div>').join('');
  $$('.g-copy').forEach(b => b.onclick = async () => {
    const txt = GUIDE[+b.dataset.copy].c;
    try { await navigator.clipboard.writeText(txt); b.textContent = 'Copied ✓'; }
    catch(e){   // clipboard blocked — fall back to selecting the text
      const pre = b.parentElement.querySelector('pre');
      const r = document.createRange(); r.selectNodeContents(pre);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      b.textContent = 'Selected — Ctrl+C';
    }
    setTimeout(() => { b.textContent = 'Copy'; }, 1600);
  });
}
const TEMPLATES = {
  cornell: {name:'cornell notes', body:
`# {{title}}

## Cues (write after class)
| Key word | What it means |
|---|---|
|  |  |

## Notes

---
`},
  flash: {name:'flashcards', body:
`# {{title}} — flashcards

  exam: {name:'exam prep', body:

};
async function insertTemplate(kind){
  const t = TEMPLATES[kind];
  if (!t) return;
  if (st.dirty) await saveCurrent(true);
  const title = prompt('Title for the new note:', '');
  if (title === null) return;
  const body = t.body.replace('{{title}}', title || t.name);
  try {
    const j = await api('/api/note', {name: safeFile(title || t.name), content: body});
    await refreshNotes();
    showTab('notes');
    await openNote(j.name);
    statusSave('template created ✓');
  } catch(e){ statusSave('could not create: ' + e.message, 'err'); }
}

/* ================================================================= tabs */
function showTab(which){
  const isNotes = which === 'notes';
  $('#tab-notes').classList.toggle('active', isNotes);
  $('#tab-guide').classList.toggle('active', !isNotes);
  $('#notes-view').style.display = isNotes ? 'flex' : 'none';
  $('#guide-pane').classList.toggle('hidden', isNotes);
}

/* =============================================================== events */
$('#tab-notes').onclick = () => showTab('notes');
$('#tab-guide').onclick = () => showTab('guide');
$('#btn-new').onclick = newNote;
$('#btn-del').onclick = deleteNote;
$('#btn-dl').onclick = downloadMd;
$('#search').oninput = async () => {
  const q = $('#search').value.trim();
  renderList();                       // instant results (names + cached content)
  if (!q) return;
  const missing = st.notes.map(n => n.name).filter(n => !(n in searchCache));
  if (missing.length){
    await ensureContents(missing);
    if ($('#search').value.trim() === q) renderList();   // content matches arrived
  }
};
$$('.seg button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
$$('.toolbar button').forEach(b => b.onclick = () => insert(b.dataset.ins));
$$('#guide-pane [data-tmpl]').forEach(b => b.onclick = () => insertTemplate(b.dataset.tmpl));

$('#src').addEventListener('input', () => { markDirty(); if (st.mode !== 'write') renderPreview(); });
$('#title').addEventListener('input', markDirty);
$('#title').addEventListener('change', () => { if (st.current) saveCurrent(); });

window.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey)) return;
  const k = e.key.toLowerCase();
  if (k === 's'){ e.preventDefault(); clearTimeout(st.saveTimer); saveCurrent(); }
  else if (k === 'n'){ e.preventDefault(); newNote(); }
  else if (k === 'b' && document.activeElement === $('#src')){ e.preventDefault(); insert('bold'); }
  else if (k === 'i' && document.activeElement === $('#src')){ e.preventDefault(); insert('italic'); }
});
window.addEventListener('beforeunload', e => {
  if (st.dirty){ e.preventDefault(); e.returnValue = ''; }
});

/* ============================================================ bootstrap */
async function boot(){
  renderGuide();
  renderPreview();
  const ok = await ping();
  await refreshNotes();
  if (st.notes.length) await openNote(st.notes[0].name);
  else if (ok) { /* empty vault — leave blank, user presses New note */ }
  else {
    // server down: restore last browser-mirrored draft
    try {
      const m = JSON.parse(localStorage.getItem(MIRROR) || 'null');
      if (m && m.content){
        st.current = m.name; $('#title').value = baseName(m.name);
        $('#src').value = m.content; renderPreview();
        statusSave('server down — showing last browser copy', 'err');
      }
    } catch(e){}
  }
  setInterval(pingLight, 30000);
}
boot();
